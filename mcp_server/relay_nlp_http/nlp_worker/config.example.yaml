relay:
  url: ws://${RELAY_IP}/${KANZI_MCP_USERNAME}
  channel: ${KANZI_MCP_USERNAME}
  role: nlp_worker
  reconnect_delay_seconds: 3
  ping_interval_seconds: 30
  ping_timeout_seconds: 10
  max_message_bytes: 16777216
  allowed_channels:
    - ${KANZI_MCP_USERNAME}
  identity:
    # The old bridge strips all sender/chat IDs. Strict compatibility therefore
    # requires one dedicated bot/relay channel per principal.
    mode: dedicated_channel
    dedicated_principal_id: ${KANZI_MCP_USERNAME}
    include_thread_scope: true

copilot:
  # Default portable flow: run login_copilot.cmd once.
  github_token: null
  use_logged_in_user: true
  # Token alternative:
  # github_token: ${GITHUB_TOKEN}
  # use_logged_in_user: false
  # Relative paths are resolved from this config file. Set this to an existing
  # Kanzi/project directory on the target machine; "." keeps the example portable.
  working_directory: ./workspace
  base_directory: ./.copilot-data
  response_timeout_seconds: 600
  max_idle_seconds: 300
  resume_failure: error
  configuration_change: new
  enable_session_store: true
  infinite_session:
    # 自动压缩上下文（SDK 1.0.26 无限会话）：利用率到阈值自动后台压缩历史，防长对话溢出
    enabled: true
    background_compaction_threshold: 0.85
    buffer_exhaustion_threshold: 0.85
  large_output:
    enabled: true
    max_size_bytes: 51200
    # {session_id} is required: every SDK session writes to its own safe files folder.
    output_directory: ./.copilot-data/session-state/{session_id}/files
  # ===== 模型配置（单模型 或 多模型注册表）=====
  # 写法 A：单模型（兼容旧版）——直接配 model，行为与旧版完全一致。
  #model:
  #  name: deepseek-v4-flash-fp8
  #  provider:
  #    type: openai
  #    base_url: https://oneapi.pateo.com.cn/v1
  #    api_key: ${OPENAI_API_KEY}
  #    wire_api: completions
  #
  # 写法 B：多模型注册表（可配任意多个，id 是内部引用名）——
  #   - 主会话 /models 列出、/model <id> 切换（/new 后生效）；
  #   - 子会话类型可在 task_dispatch.session_types.<type>.model 指定默认模型；
  #   - default_model 不配 = 取第一个。
  models:
    - id: gpt-5.6-sol
      name: gpt-5.6-sol
      reasoning_effort: medium
      provider:
        type: github
    
    - id: deepseek-v4-flash-fp8
      name: deepseek-v4-flash-fp8
      provider:
        type: openai
        base_url: https://oneapi.pateo.com.cn/v1
        api_key: ${OPENAI_API_KEY}
        wire_api: completions   #responses
    
    - id: GLM-5.3
      name: GLM-5.3
      provider:
        type: openai
        base_url: https://airdgw-pro.pateo.com.cn/api/v2
        api_key: ${PATEO_API_KEY}
        wire_api: completions
    
    - id: GLM-5.3-Flash
      name: GLM-5.3-Flash
      provider:
        type: openai
        base_url: https://airdgw-pro.pateo.com.cn/api/v2
        api_key: ${PATEO_API_KEY}
        wire_api: completions
    
    #name: deepseek-ai/DeepSeek-V4-Flash
    #provider:
    #  type: openai
    #  base_url: https://api.siliconflow.cn/v1
    #  api_key: ${SILICONFLOW_API_KEY}
    #  wire_api: completions   #responses
      
      
    #name: deepseek-v4-flash-fp8
    ##reasoning_effort: medium
    #provider:
    #  type: openai
    #  # BYOK example:
    #  # type: openai
    #  base_url: https://oneapi.pateo.com.cn/v1
    #  api_key: ${OPENAI_API_KEY}
    #  wire_api: completions   #responses
    # Optional SDK 1.0.11 fields: transport, headers, model_id, wire_model,
    # max_prompt_tokens, max_output_tokens. Azure supports azure_api_version.
  # 默认模型 id（不配 = models 第一个）
  default_model: GLM-5.3
  agent:
    system_prompt: |
      你是通过飞书提供服务的 GitHub Copilot 助手。需要操作 Kanzi 时使用已配置的 MCP。
      操作 Kanzi 时必须严格按照已加载的 skill 执行：先理解 kanzi-skills-index skill 并拿到需要的 skill 通读全文，再严格按其步骤执行，禁止自由发挥、禁止脑补参数。
      若回复中需要让旧飞书桥上传文件，请继续使用：
      [FILE]
      path=<文件绝对路径>
      截图工具返回附件时，确保将资源落盘并按上述格式返回文件路径。
      Kanzi MCP 返回 JSON 下载 URL 时，先调用 artifact_download；不要把下载正文直接放入回复。
      使用 artifact_read、artifact_search 或 artifact_json_query 只读取完成任务所需的小片段。
      图片 URL 或 JSON 中的 base64/data URL 图片使用 artifact_materialize_image；随后把该工具返回的
      [FILE] path 标记原样放入最终回复。
    system_prompt_mode: append
    available_tools: []
    excluded_tools: []
  permissions:
    # ask 在无安全交互审批 UI 的飞书链路中会按 deny 处理。
    default: allow
    allow:
      # Runtime 实际的只读权限 kind。
      - read
      - read_file
      - grep
      - glob
      - write_file
      - edit_file
      - shell
      - kanzi-studio-mcp-*
      - kanzi-api-mcp-*
      - kanzi-doc-mcp-*
    deny: []
      #- shell
      #- write_file
      #- edit_file
      #- kanzi-*-kz_delete_*
    ask: []

skills:
  max_file_bytes: 131072
  max_total_bytes: 524288
  entries:
    # ⚠️ task_dispatch 子会话按类型注入 skill：这里必须指向【skill 父目录】
    #（无自身 SKILL.md 时自动递归发现所有子 skill），否则子会话只能加载到
    # 单一路径下的 skill。主会话需要注入 kanzi-main-protocol（调度协议）。
    #
    # ⚠️ 本地优先 + skill-mcp 兜底（2026-11-04）：
    #   - 本地 entries 有同名 skill → 用本地的（测试覆盖场景）；
    #   - 本地缺失 → 从 mcp_servers.kanzi-skill-mcp 的 get_skill 实时拉取注入
    #     （团队统一维护点，改 skill 即全团队生效；不缓存到本地）；
    #   - 拉取失败/不存在 → 静默跳过（log 一条），不报错；
    #   - 本地目录不存在/为空 → 不报错，全部走 skill-mcp。
    # 例：
    # - path: D:\AIBox\kanzimcp\nlp-worker-portable-win-x64\skills
    #   enabled: true
    - path: ./skills
      enabled: true
    

mcp_servers:
  # These three endpoints preserve the existing HTTP → relay → Kanzi route.
  kanzi-studio-mcp:
    enabled: true
    type: http
    url: http://${KANZI_MCP_IP}/kanzistudio_mcp
    headers:
      X-Kanzi-User: ${KANZI_MCP_USERNAME}
    tools: ["*"]
    timeout_seconds: 300
  kanzi-skill-mcp:
    enabled: true
    type: http
    url: http://${KANZI_MCP_IP}/kanzi_skill_mcp
    headers:
      X-Kanzi-User: ${KANZI_MCP_USERNAME}
    tools: ["*"]
    timeout_seconds: 300
  kanzi-api-mcp:
    enabled: true
    type: http
    url: http://${KANZI_MCP_IP}/kanzi_api_mcp
    headers:
      X-Kanzi-User: ${KANZI_MCP_USERNAME}
    tools: ["*"]
    timeout_seconds: 300
  kanzi-doc-mcp:
    enabled: true
    type: http
    url: http://${KANZI_MCP_IP}/kanzi_doc_mcp
    headers:
      X-Kanzi-User: ${KANZI_MCP_USERNAME}
    tools: ["*"]
    timeout_seconds: 300
  # local-example:
  #   enabled: false
  #   type: stdio
  #   command: python
  #   args: ["./server.py"]
  #   env: {TOKEN: "${LOCAL_MCP_TOKEN}"}
  #   cwd: .
  #   tools: ["*"]
  #   timeout_seconds: 30

artifacts:
  enabled: true
  # Exact scheme + host + port only. Redirects and all other origins are rejected.
  allowed_origins:
    - http://${ARTIFACT_FEISHU}
    - http://${ARTIFACT_HTTP}
  timeout_seconds: 60
  max_download_bytes: 67108864
  max_tool_output_chars: 8000
  max_search_results: 50
  allowed_mime_types:
    - application/json
    - text/plain
    - image/png
    - image/jpeg
    - image/svg+xml
    - application/octet-stream

compatibility:
  thinking_text: "🤖 Copilot 思考中..."
  # 多阶段活动反馈(progress): 默认开, 设为 false 即恢复旧行为(仅 thinking+最终回复)
  progress_feedback: true
  # 相邻两条 progress 最小间隔(秒), 防刷屏; 建议 2~3, 太小会密集刷屏
  progress_min_interval_seconds: 2.0
  # 工具事件累积超过该阈值后改为汇总式提示(如 "已执行 5/12 个工具")
  progress_max_tool_events_before_summary: 8
  output_type: claude_output
  support_file_download_marker: true
  bridge_http: http://${FEISHU_BRIDGE}/${KANZI_MCP_USERNAME}
  bridge_target_open_id: null
  # Legacy Feishu [FILE_DOWNLOAD] timeout. Downloads must match bridge_http origin.
  download_timeout_seconds: 120
  max_upload_bytes: 20971520
  # Extra trusted roots. Relative paths are resolved from config.yaml.
  # working_directory and .copilot-data/session-state/<session-id>/files are
  # allowed automatically; never add the entire .copilot-data directory here.
  upload_allowed_roots: 
    - ./

messages:
  max_input_chars: 12000
  max_output_chars: 3500
  queue_size: 256
  worker_count: 1
  dedup_ttl_seconds: 86400

storage:
  database_path: ./data/bridge.db

logging:
  level: INFO
  file: ./logs/bridge.log
  max_bytes: 10485760
  backup_count: 5

# ===== 任务派发（主会话 → 子会话按类型隔离执行）=====
# 2026-10-21 老隋要求：主会话读需求/步骤、生成任务参数落盘，调 task_dispatch 派发
# 子会话按类型独立（上下文隔离），参数/结果不进主会话上下文。
task_dispatch:
  enabled: true
  # 任务参数文件目录（相对 copilot.working_directory；子会话读取执行）
  task_dir: ./workfile/tasks
  # 汇报模式：success_fail_only = 只报成功/失败原因（不回过程）
  report: success_fail_only
  # 子会话默认模型 id：子会话类型没指定 model 时用它；
  # 这个也没配 → 用 copilot.default_model。
  default_model: GLM-5.3-Flash
  # 主会话注入的 skill（调度协议；不配则用代码默认：main-protocol + index + highfreq）
  main_skills:
    - kanzi-main-protocol
    - kanzi-skills-index
    - kanzi-studio-mcp
  # 所有子会话共用的 skill（执行协议；不配则用代码默认：task-execution-protocol + index + studio-mcp + project-switch + highfreq）
  common_skills:
    - kanzi-task-execution-protocol
    - kanzi-skills-index
    - kanzi-properties-highfreq
    - kanzi-studio-mcp
    - kanzi-node-create
  # 子会话类型 → 该类型注入的专属 skill（不配则用代码默认表；每个类型再自动叠加 common_skills）
  # 每个类型可额外配 model: <模型id> 指定该类型子会话默认模型（不配 = 全局 default_model）
  # 旧写法 `类型: [skill列表]` 仍兼容。
  session_types:
    create-node:
      skills: [kanzi-node-create, kanzi-layout, kanzi-textblock, kanzi-transform, kanzi-prefab, kanzi-asset-create]
      # model: GLM-5.3-Flash   # 可选：该类型子会话默认模型
    create-state-machine:
      skills: [kanzi-state-manager, kanzi-trigger, kanzi-prop-set, kanzi-proptype]
      model: GLM-5.3
    create-property:
      skills: [kanzi-proptype, kanzi-prop-set]
      model: GLM-5.3
    create-resource:
      skills: [kanzi-resource-create, kanzi-resource-set, kanzi-asset-create]
    localization:
      skills: [kanzi-localization]
      model: GLM-5.3
    texture:
      skills: [kanzi-asset-create]
    animation:
      skills: [kanzi-animation]
    binding:
      skills: [kanzi-binding, kanzi-prop-set, kanzi-alias, kanzi-prefab]
    alias:
      skills: [kanzi-alias]
    shader:
      skills: [kanzi-shader, kanzi-material-brush]
      model: GLM-5.3
    save-export:
      skills: [kanzi-save-export]
    # 大文件数据源预处理（主会话阶段3判断数据源大时第一个子任务；只提取数据，不调 Kanzi）
    data-source-process:
      skills: [kanzi-data-source]
      model: GLM-5.3

# ===== 网页控制台（会话管理 + 配置修改，随 nlp_worker 同进程启动）=====
web:
  enabled: true
  # 仅本机访问；改 0.0.0.0 或局域网 IP 可被其他机器访问（无鉴权，注意安全）
  listen_host: 0.0.0.0
  listen_port: 8400
  